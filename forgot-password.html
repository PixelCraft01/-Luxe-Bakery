<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your LUXE Bakery password">
  <meta name="author" content="LUXE Bakery">
  <title>Forgot Password | LUXE Bakery</title>
  <link rel="icon" href="images/logo/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="site-header"></div>

<!-- Page Header -->
<section class="hero-section" style="min-height:auto;padding:160px 0 80px">
  <div class="container">
    <div class="text-center" data-aos="fade-up">
      <h1 class="hero-title">Reset Password</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb justify-content-center" style="background:none;padding:0;margin:0">
          <li class="breadcrumb-item"><a href="index.html" style="color:var(--primary)">Home</a></li>
          <li class="breadcrumb-item active text-dark">Forgot Password</li>
        </ol>
      </nav>
    </div>
  </div>
</section>

<!-- Forgot Password Section -->
<section class="section-padding">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12" style="max-width:480px;" data-aos="fade-up">
        <div class="card border-0 shadow-sm" style="border-radius:var(--radius-lg);padding:40px;">

          <!-- Forgot Form -->
          <div id="forgotFormWrapper">
            <h4 class="fw-bold text-center mb-2">Forgot Your Password?</h4>
            <p class="text-muted text-center mb-4" style="font-size:0.9rem;">Enter your email and we'll send you a reset link.</p>
            <form id="forgotForm" class="needs-validation" novalidate>
              <div class="mb-4">
                <label for="forgotEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="forgotEmail" placeholder="Enter your email" required>
                <div class="invalid-feedback">Please enter a valid email.</div>
              </div>
              <button type="submit" class="btn-luxe w-100 justify-content-center">Send Reset Link</button>
            </form>
            <div class="text-center mt-4">
              <a href="login.html" style="font-size:0.9rem;color:var(--primary);"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </div>
          </div>

          <!-- Success Message (hidden by default) -->
          <div id="forgotSuccess" style="display:none;" class="text-center">
            <div class="success-icon mx-auto mb-4" style="width:80px;height:80px;border-radius:50%;background:#28a745;display:flex;align-items:center;justify-content:center;">
              <i class="bi bi-check-lg" style="font-size:2.5rem;color:#fff;"></i>
            </div>
            <h4 class="fw-bold mb-2">Reset link sent!</h4>
            <p class="text-muted mb-4" style="font-size:0.9rem;">Check your email for password reset instructions.</p>
            <a href="login.html" class="btn-luxe">Back to Login</a>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/script.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', function(e) {
  e.preventDefault();
  document.getElementById('forgotFormWrapper').style.display = 'none';
  document.getElementById('forgotSuccess').style.display = 'block';
});
</script>
</body>
</html>
