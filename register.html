<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your LUXE Bakery account">
  <meta name="author" content="LUXE Bakery">
  <title>Register | LUXE Bakery</title>
  <link rel="icon" href="images/logo/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="site-header"></div>

<!-- Page Header -->
<section class="hero-section" style="min-height:auto;padding:160px 0 80px">
  <div class="container">
    <div class="text-center" data-aos="fade-up">
      <h1 class="hero-title">Create Account</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb justify-content-center" style="background:none;padding:0;margin:0">
          <li class="breadcrumb-item"><a href="index.html" style="color:var(--primary)">Home</a></li>
          <li class="breadcrumb-item active text-dark">Register</li>
        </ol>
      </nav>
    </div>
  </div>
</section>

<!-- Register Section -->
<section class="section-padding">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12" style="max-width:480px;" data-aos="fade-up">
        <div class="card border-0 shadow-sm" style="border-radius:var(--radius-lg);padding:40px;">
          <h4 class="fw-bold text-center mb-4">Join LUXE Bakery</h4>
          <form id="registerForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="regName" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="regName" placeholder="Your full name" required>
              <div class="invalid-feedback">Please enter your full name.</div>
            </div>
            <div class="mb-3">
              <label for="regEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="regEmail" placeholder="Enter your email" required>
              <div class="invalid-feedback">Please enter a valid email.</div>
            </div>
            <div class="mb-3">
              <label for="regPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="regPassword" placeholder="Min 6 characters" minlength="6" required>
              <div class="invalid-feedback">Password must be at least 6 characters.</div>
            </div>
            <div class="mb-3">
              <label for="regConfirmPassword" class="form-label">Confirm Password</label>
              <input type="password" class="form-control" id="regConfirmPassword" placeholder="Confirm password" minlength="6" required>
              <div class="invalid-feedback">Please confirm your password.</div>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agreeTerms" required>
              <label class="form-check-label" for="agreeTerms" style="font-size:0.9rem;">I agree to the <a href="#" style="color:var(--primary);">Terms &amp; Conditions</a></label>
              <div class="invalid-feedback">You must agree to the terms.</div>
            </div>
            <button type="submit" class="btn-luxe w-100 justify-content-center">Register</button>
          </form>
          <div class="text-center my-4" style="position:relative;">
            <hr>
            <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:0 12px;color:var(--text-muted);font-size:0.85rem;">or</span>
          </div>
          <p class="text-center mb-0" style="font-size:0.9rem;">Already have an account? <a href="login.html" style="color:var(--primary);font-weight:500;">Login</a></p>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/script.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', function(e) {
  var pw = document.getElementById('regPassword').value;
  var cpw = document.getElementById('regConfirmPassword').value;
  if (pw !== cpw) {
    e.preventDefault();
    document.getElementById('regConfirmPassword').setCustomValidity('Passwords do not match');
  }
});
</script>
</body>
</html>
