<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - LUXE Bakery">
  <meta name="author" content="LUXE Bakery">
  <title>404 - Page Not Found | LUXE Bakery</title>
  <link rel="icon" href="images/logo/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<!-- Header Component (loaded dynamically) -->
<div id="site-header"></div>

<!-- 404 Error Page (keep existing) -->
<section class="error-page d-flex align-items-center justify-content-center" style="min-height:100vh;background:var(--cream);">
  <div class="container text-center" style="padding-top:80px;">
    <div data-aos="zoom-in">
      <img src="images/illustrations/404.svg" alt="404 Illustration" style="max-width:350px;width:100%;margin-bottom:2rem;">
    </div>
    <h1 class="error-page h1" data-aos="fade-up" data-aos-delay="100" style="font-size:6rem;font-weight:700;color:var(--primary);line-height:1;">404</h1>
    <h2 class="fw-bold mb-3" data-aos="fade-up" data-aos-delay="200">Oops! Page Not Found</h2>
    <p class="text-muted mb-4 mx-auto" style="max-width:500px;" data-aos="fade-up" data-aos-delay="300">The page you're looking for doesn't exist or has been moved. Let's get you back to our delicious offerings.</p>
    <div class="d-flex gap-3 justify-content-center" data-aos="fade-up" data-aos-delay="400">
      <a href="index.html" class="btn-luxe"><i class="bi bi-house me-1"></i>Go Home</a>
      <a href="shop.html" class="btn-outline-luxe">Back to Shop <i class="bi bi-arrow-right"></i></a>
    </div>
  </div>
</section>

<!-- Footer Component (loaded dynamically) -->
<div id="site-footer"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
