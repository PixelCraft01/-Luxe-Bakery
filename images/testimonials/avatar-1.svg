<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgA1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C89B3C"/>
      <stop offset="100%" style="stop-color:#8B5E3C"/>
    </linearGradient>
    <linearGradient id="personA1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F2"/>
      <stop offset="100%" style="stop-color:#F0E0D0"/>
    </linearGradient>
    <clipPath id="circle1">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>
  
  <!-- Circle background -->
  <circle cx="50" cy="50" r="49" fill="#2C241D"/>
  <circle cx="50" cy="50" r="48" fill="url(#bgA1)"/>
  
  <!-- Content clipped to circle -->
  <g clip-path="url(#circle1)">
    <!-- Person silhouette -->
    <!-- Head -->
    <circle cx="50" cy="38" r="16" fill="url(#personA1)"/>
    
    <!-- Body/shoulders -->
    <path d="M20,90 Q20,65 50,60 Q80,65 80,90Z" fill="url(#personA1)"/>
    
    <!-- Hair detail -->
    <ellipse cx="50" cy="30" rx="17" ry="12" fill="#FFF8F2" opacity="0.3"/>
  </g>
  
  <!-- Gold border ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#C89B3C" stroke-width="2" opacity="0.6"/>
</svg>