<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgA3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8A040"/>
      <stop offset="100%" style="stop-color:#C89B3C"/>
    </linearGradient>
    <linearGradient id="personA3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F2"/>
      <stop offset="100%" style="stop-color:#F0E0D0"/>
    </linearGradient>
    <clipPath id="circle3">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>
  
  <!-- Circle background -->
  <circle cx="50" cy="50" r="49" fill="#2C241D"/>
  <circle cx="50" cy="50" r="48" fill="url(#bgA3)"/>
  
  <!-- Content clipped to circle -->
  <g clip-path="url(#circle3)">
    <!-- Person silhouette -->
    <!-- Head -->
    <circle cx="50" cy="38" r="16" fill="url(#personA3)"/>
    
    <!-- Body/shoulders -->
    <path d="M16,94 Q16,65 50,57 Q84,65 84,94Z" fill="url(#personA3)"/>
    
    <!-- Hair - third variation -->
    <path d="M33,34 Q34,20 50,18 Q66,20 67,34 Q62,25 50,23 Q38,25 33,34Z" fill="#FFF8F2" opacity="0.2"/>
  </g>
  
  <!-- Gold border ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#C89B3C" stroke-width="2" opacity="0.6"/>
</svg>