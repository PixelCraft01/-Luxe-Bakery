<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgA2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5E3C"/>
      <stop offset="100%" style="stop-color:#6B4226"/>
    </linearGradient>
    <linearGradient id="personA2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F2"/>
      <stop offset="100%" style="stop-color:#F0E0D0"/>
    </linearGradient>
    <clipPath id="circle2">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>
  
  <!-- Circle background -->
  <circle cx="50" cy="50" r="49" fill="#2C241D"/>
  <circle cx="50" cy="50" r="48" fill="url(#bgA2)"/>
  
  <!-- Content clipped to circle -->
  <g clip-path="url(#circle2)">
    <!-- Person silhouette -->
    <!-- Head -->
    <circle cx="50" cy="38" r="16" fill="url(#personA2)"/>
    
    <!-- Body/shoulders -->
    <path d="M18,92 Q18,65 50,58 Q82,65 82,92Z" fill="url(#personA2)"/>
    
    <!-- Hair - slightly different style -->
    <path d="M34,32 Q35,22 50,20 Q65,22 66,32 Q65,28 50,26 Q35,28 34,32Z" fill="#FFF8F2" opacity="0.25"/>
  </g>
  
  <!-- Gold border ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#C89B3C" stroke-width="2" opacity="0.6"/>
</svg>