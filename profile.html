<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your LUXE Bakery profile - orders, wishlist, and account settings">
  <meta name="author" content="LUXE Bakery">
  <title>My Profile | LUXE Bakery</title>
  <link rel="icon" href="images/logo/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="site-header"></div>

<!-- Page Header -->
<section class="hero-section" style="min-height:auto;padding:160px 0 80px">
  <div class="hero-bg" style="background:var(--dark)"></div>
  <div class="container">
    <div class="text-center" data-aos="fade-up">
      <h1 class="hero-title">My Profile</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb justify-content-center" style="background:none;padding:0;margin:0">
          <li class="breadcrumb-item"><a href="index.html" style="color:var(--primary)">Home</a></li>
          <li class="breadcrumb-item active" style="color:#fff">Profile</li>
        </ol>
      </nav>
    </div>
  </div>
</section>

<!-- Profile Section -->
<section class="section-padding" id="profilePage">
  <div class="container">
    <div class="row g-4">

      <!-- Left Sidebar -->
      <div class="col-lg-3" data-aos="fade-right">
        <div class="profile-sidebar card border-0 shadow-sm" style="border-radius:var(--radius-lg);padding:30px;text-align:center;">
          <div id="profilePhoto" class="profile-photo mx-auto mb-3" style="width:90px;height:90px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:600;">
            <!-- Initials or image inserted by JS -->
          </div>
          <h5 id="profileName" class="fw-bold mb-1">User</h5>
          <small id="profileEmail" class="text-muted d-block mb-4">user@email.com</small>
          <nav class="d-flex flex-column gap-1">
            <button class="profile-sidebar-link active text-start w-100" data-profile-tab="orders" style="border:none;background:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:500;">
              <i class="bi bi-bag me-2"></i>My Orders
            </button>
            <button class="profile-sidebar-link text-start w-100" data-profile-tab="wishlist" style="border:none;background:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:500;">
              <i class="bi bi-heart me-2"></i>Wishlist
            </button>
            <button class="profile-sidebar-link text-start w-100" data-profile-tab="edit" style="border:none;background:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:500;">
              <i class="bi bi-pencil-square me-2"></i>Edit Profile
            </button>
            <button class="profile-sidebar-link text-start w-100" onclick="window.luxeApp.logout()" style="border:none;background:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:500;color:#dc3545;">
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
          </nav>
        </div>
      </div>

      <!-- Right Content -->
      <div class="col-lg-9" data-aos="fade-left">

        <!-- Tab: My Orders -->
        <div id="profile-orders" class="profile-tab">
          <h4 class="fw-bold mb-4">My Orders</h4>
          <div id="ordersList">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Tab: Wishlist -->
        <div id="profile-wishlist" class="profile-tab" style="display:none;">
          <h4 class="fw-bold mb-4">Wishlist</h4>
          <div id="wishlistProfile">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Tab: Edit Profile -->
        <div id="profile-edit" class="profile-tab" style="display:none;">
          <h4 class="fw-bold mb-4">Edit Profile</h4>
          <form id="profileForm" class="needs-validation" novalidate>
            <div class="row g-3">
              <div class="col-12">
                <label for="editProfileEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="editProfileEmail" disabled>
              </div>
              <div class="col-md-6">
                <label for="editName" class="form-label">Name</label>
                <input type="text" class="form-control" id="editName" placeholder="Your name">
              </div>
              <div class="col-md-6">
                <label for="editPhone" class="form-label">Phone</label>
                <input type="tel" class="form-control" id="editPhone" placeholder="Your phone number">
              </div>
              <div class="col-12">
                <label for="editAddress" class="form-label">Address</label>
                <textarea class="form-control" id="editAddress" rows="3" placeholder="Your address"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn-luxe">Save Changes</button>
              </div>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/script.js"></script>
</body>
</html>
