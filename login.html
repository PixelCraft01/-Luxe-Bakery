<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your LUXE Bakery account">
  <meta name="author" content="LUXE Bakery">
  <title>Login | LUXE Bakery</title>
  <link rel="icon" href="images/logo/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div id="site-header"></div>

<!-- Page Header -->
<section class="hero-section" style="min-height:auto;padding:160px 0 80px">
  <div class="container">
    <div class="text-center" data-aos="fade-up">
      <h1 class="hero-title">Welcome Back</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb justify-content-center" style="background:none;padding:0;margin:0">
          <li class="breadcrumb-item"><a href="index.html" style="color:var(--primary)">Home</a></li>
          <li class="breadcrumb-item active text-dark">Login</li>
        </ol>
      </nav>
    </div>
  </div>
</section>

<!-- Login Section -->
<section class="section-padding">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12" style="max-width:480px;" data-aos="fade-up">
        <div class="card border-0 shadow-sm" style="border-radius:var(--radius-lg);padding:40px;">
          <h4 class="fw-bold text-center mb-4">Login to Your Account</h4>
          <form id="loginForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required>
              <div class="invalid-feedback">Please enter a valid email.</div>
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" required>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe" style="font-size:0.9rem;">Remember Me</label>
              </div>
              <a href="forgot-password.html" style="font-size:0.9rem;color:var(--primary);">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-luxe w-100 justify-content-center">Login</button>
          </form>
          <div class="text-center my-4" style="position:relative;">
            <hr>
            <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:0 12px;color:var(--text-muted);font-size:0.85rem;">or</span>
          </div>
          <p class="text-center mb-0" style="font-size:0.9rem;">Don't have an account? <a href="register.html" style="color:var(--primary);font-weight:500;">Register</a></p>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/script.js"></script>
</body>
</html>
